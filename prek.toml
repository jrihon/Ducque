# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    # Default 500 KB limit everywhere, except the figure directories of the docs
    { id = "check-added-large-files", exclude = '^docs/(.+/)?figures/' },
    # Figures embed raster images, so allow up to 5 MB (5120 KB) there
    { id = "check-added-large-files", name = "check added large files (docs figures, max 5 MB)", files = '^docs/(.+/)?figures/', args = ["--maxkb=5120"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  { id = "ruff-check", args = ["--fix"]},
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"
hooks = [
  { id = "rumdl-check", args = ["--fix"] }, # Lint only; add args [--fix] to auto-fix
  { id = "rumdl-fmt" }, # Format in place
]

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"
hooks = [
  { id = "yamlfmt" }, # Format in place
]
