version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 3
