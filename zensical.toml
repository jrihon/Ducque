[project]
site_name = "ducque"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "The Ducque Manual" = [
    "manual/ducque-manual.md",
    { "Acknowledgements" = "manual/introduction/acknowledgements.md" },
    { "Introduction" = "manual/introduction/introduction.md" },
    { "Installing and running Ducque" = "manual/installation/installation.md" },
    { "Usage" = [
      { "Build" = "manual/usage/build.md" },
      { "Transmute Nucleoside" = "manual/usage/transmute-nucleoside.md" },
      { "Transmute Linker" = "manual/usage/transmute-linker.md" },
      { "Transmute Nucleobase" = "manual/usage/transmute-nucleobase.md" },
      { "Randomise" = "manual/usage/randomise.md" },
      { "XYZ → PDB" = "manual/usage/xyz-to-pdb.md" },
      { "GUI" = "manual/usage/gui.md" },
      { "Available input by default" = "manual/usage/available-inputs.md" },
      { "Step-by-step instructions" = "manual/usage/step-by-step.md" },
    ] },
    { "User implementation" = [
      { "How to add to Ducque's src files" = "manual/user-implementation/library-tables.md" },
      { "Defining torsion angles" = "manual/user-implementation/torsion-angles.md" },
    ] },
  ] },
  { "How to create a Forcefield" = [
    "how-to-create-a-forcefield.md",
    { "Start a prep file" = "forcefield/prep-file.md" },
    { "RESP Charge derivation" = "forcefield/resp-charge-derivation.md" },
    { "Forcefield file generation" = "forcefield/forcefield-file-generation.md" },
    { "Miscellaneous" = "forcefield/miscellaneous.md" },
  ] },
  { "Developer" = [
    { "Developer setup" = "developer/developer-setup.md" },
    { "Zensical usage" = "developer/zensical-usage.md" },
  ] },
]

# Footnotes and pymdownx.arithmatex (generic) are enabled by Zensical's default
# markdown extensions; MathJax only needs to be loaded to render the equations.
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
features = [
  "navigation.footer", # previous/next page links at the bottom, following the nav order
  "content.code.copy", # copy-to-clipboard button on every code block
]
